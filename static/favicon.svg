<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<!-- Cadoro's icon: Lucide's "timer" (https://lucide.dev/icons/timer, ISC licence), centred on
	     a rounded rose-700 square. The timer stays inside the middle 80%, which Android never
	     crops from a maskable icon. -->
	<rect width="32" height="32" rx="7" fill="#c70036" />
	<g
		transform="translate(4 4)"
		fill="none"
		stroke="#ffffff"
		stroke-width="2"
		stroke-linecap="round"
		stroke-linejoin="round"
	>
		<line x1="10" x2="14" y1="2" y2="2" />
		<line x1="12" x2="15" y1="14" y2="11" />
		<circle cx="12" cy="14" r="8" />
	</g>
</svg>
