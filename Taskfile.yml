# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Workflows that would otherwise be typed by hand, one command at a time. Run `task` to list them,
# or `go-task` where it's installed under that name, as on Fedora.
#
# Tasks call the npm scripts in package.json rather than repeating their commands. CI calls those
# npm scripts itself, one step each, so it never needs go-task.

version: '3'

vars:
  # The folder GitHub Pages serves the app from, as the production Playwright tests use it.
  PAGES_BASE_PATH: /cadoro
  # A production preview's port, clear of the dev server's 5173 and the tests' 4175 and 4176.
  PREVIEW_PORT: 4199
  # The dev server's port, from `PORT` as dev-server.ts reads it, or Vite's 5173.
  DEV_PORT:
    sh: echo "${PORT:-5173}"
  # A branch name as the git rules want it: a Conventional Commits type, a slash, then words in
  # lower case joined by hyphens, optionally starting with an issue number.
  BRANCH_PATTERN: ^(feat|fix|docs|style|refactor|perf|test|build|ci|ops|chore|revert)/[a-z0-9]+(-[a-z0-9]+)*$
  # The main checkout, which every worktree shares, found from inside any of them.
  MAIN_CHECKOUT:
    sh: dirname "$(git rev-parse --path-format=absolute --git-common-dir)"
  # Worktrees sit beside the repo, in `../<repo>-worktrees/`.
  WORKTREES_FOLDER: '{{dir .MAIN_CHECKOUT}}/{{base .MAIN_CHECKOUT}}-worktrees'
  # Git-ignored files a worktree needs copied from the main checkout: Claude's and the editors'
  # local settings.
  LOCAL_SETTINGS: .claude .zed .vscode CLAUDE.local.md
  # A command printing the id of the current branch's latest CI run, for tasks that read one.
  LATEST_RUN_COMMAND: >-
    gh run list --branch "$(git branch --show-current)" --limit 1 --json databaseId
    --jq '.[0].databaseId'

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      # `TASK_EXE` is the name go-task was started with, `task` or `go-task`.
      - '{{.TASK_EXE}} --list'

  setup:
    desc: Install the locked dependencies and Playwright's Chromium, in a fresh clone or worktree
    cmds:
      - npm ci
      - npx playwright install chromium

  check:
    desc: Run every check CI runs, in the same order, stopping at the first failure
    # The npm scripts after the CI image's check must match the steps of the `Checks` job in
    # .github/workflows/pipeline.yml, cheapest first.
    cmds:
      - task: check:ci-image
      - task: check:quick
      - npm run build
      - npm run test:e2e

  check:quick:
    desc: Run the checks that take seconds, leaving out the build and the Playwright tests
    cmds:
      - npm run lint
      - npm run format:check
      - npm run typecheck
      - npm test

  check:ci-image:
    desc: Check that CI's Playwright image matches the Playwright version in the lockfile
    vars:
      LOCKED_VERSION:
        sh: >-
          node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version"
      IMAGE_VERSION:
        sh: >-
          node -p "require('node:fs').readFileSync('.github/workflows/pipeline.yml', 'utf8')
          .match(/playwright:v([0-9.]+)-/)[1]"
    # The image's browsers are built for one Playwright version, so the two are bumped together.
    preconditions:
      - sh: '[ "{{.IMAGE_VERSION}}" = "{{.LOCKED_VERSION}}" ]'
        msg: >-
          CI's Playwright image is v{{.IMAGE_VERSION}}, but the lockfile has Playwright
          {{.LOCKED_VERSION}}. Change the image's tag in .github/workflows/pipeline.yml to match.
    cmds:
      - echo "CI's Playwright image matches Playwright {{.LOCKED_VERSION}}."

  fix:
    desc: Format every file and fix what ESLint can, then list the files with changes
    cmds:
      # Runs last, even when ESLint finds something it can't fix, so the changes made so far still
      # show. A `defer` only counts once go-task reaches it, so it comes first.
      - defer: git status --short
      - npm run format
      - npm run lint -- --fix

  audit:
    desc: List known vulnerabilities in the packages the app ships, leaving out development tools
    cmds:
      - npm audit --omit=dev

  clean:
    desc: Delete the build and the test results, which the build and the tests make again
    cmds:
      - rm -rf build test-results playwright-report

  e2e:repeat:
    desc: Run the Playwright tests TIMES times (10 by default) to catch flaky ones, passing on anything after --
    summary: |
      Runs the Playwright tests TIMES times over, side by side, to catch a test that only
      sometimes fails. Anything after `--` goes to Playwright, such as a project or a test's name:

        task e2e:repeat -- --project updates
        task e2e:repeat TIMES=40 -- -g "another tab"
    vars:
      TIMES: '{{.TIMES | default 10}}'
    cmds:
      - npm run test:e2e -- --repeat-each {{.TIMES}} {{.CLI_ARGS}}

  e2e:report:
    desc: Open the report of the last Playwright run, with the traces of any failed tests
    preconditions:
      - sh: '[ -d playwright-report ]'
        msg: There's no report yet. Run the Playwright tests first, such as with `task check`.
    cmds:
      - npx playwright show-report

  preview:production:
    desc: Build the app as GitHub Pages serves it, under /cadoro, and serve it on PORT (4199 by default)
    vars:
      PORT: '{{.PORT | default .PREVIEW_PORT}}'
    env:
      BASE_PATH: '{{.PAGES_BASE_PATH}}'
    preconditions:
      # Checked before building, rather than leaving Vite to find out after the build.
      - sh: '[ -z "$(ss -Hltn "sport = :{{.PORT}}")" ]'
        msg: Port {{.PORT}} is in use. Run `task ports` to see by what, or pick another with PORT=….
    cmds:
      - npm run build
      - npm run preview -- --port {{.PORT}} --strictPort

  dev:phone:
    desc: Run the dev server for the phone connected over USB, which opens it at localhost
    summary: |
      Forwards the dev server's port from the phone to this computer with `adb reverse`, then
      starts the dev server. The phone opens http://localhost:{{.DEV_PORT}}, which browsers treat
      as secure, as they do a site served over HTTPS. Needs USB debugging on in the phone's
      developer options.
    preconditions:
      - sh: '[ "$(adb get-state 2>/dev/null)" = device ]'
        msg: >-
          No phone found over USB. Connect it with USB debugging on, accept the prompt on the
          phone, and check that `adb devices` lists it.
    cmds:
      - adb reverse tcp:{{.DEV_PORT}} tcp:{{.DEV_PORT}}
      - npm run dev

  ports:
    desc: Show what's listening on each of the project's ports, and which are free
    summary: |
      5173 is the dev server (or PORT), 4175 the production build the Playwright tests use, 4176
      the update tests' server, and 4199 a production preview. The test ports are set in
      playwright.config.ts.
    vars:
      PROJECT_PORTS: '{{.DEV_PORT}} 4175 4176 {{.PREVIEW_PORT}}'
    silent: true
    cmds:
      - for: { var: PROJECT_PORTS }
        cmd: |
          listener="$(ss -Hltnp "sport = :{{.ITEM}}")"
          echo "{{.ITEM}}: ${listener:-free}"

  branch:new:
    desc: Start a branch named BRANCH, such as feat/run-history, from the latest main
    requires:
      vars: [BRANCH]
    preconditions:
      - sh: '[[ "{{.BRANCH}}" =~ {{.BRANCH_PATTERN}} ]]'
        msg: >-
          "{{.BRANCH}}" isn't a type and a short description, such as feat/run-history or
          fix/123-break-rounding. The types are those of Conventional Commits.
      # Uncommitted changes would come along to the new branch.
      - sh: '[ -z "$(git status --porcelain)" ]'
        msg: >-
          This branch has uncommitted changes. Leave them here and start the other work in a
          worktree, with `task worktree:new`.
    cmds:
      - git fetch origin
      # Without --no-track, the new branch would treat origin/main as its upstream, and a plain
      # `git push` would push to main.
      - git switch --no-track -c {{.BRANCH}} origin/main

  branch:delete:
    desc: Delete the local branch BRANCH, once all its commits are on main
    requires:
      vars: [BRANCH]
    preconditions:
      - sh: '[ "$(git branch --show-current)" != "{{.BRANCH}}" ]'
        msg: You're on {{.BRANCH}}. Switch to main first.
    cmds:
      - task: branch:check-merged
        vars: { BRANCH: '{{.BRANCH}}' }
      # Forced, because `-d` only knows about merges, and branch:check-merged has already found
      # every commit on main, whichever way it got there.
      - git branch -D {{.BRANCH}}

  branch:check-merged:
    desc: Fail unless every commit on BRANCH is on main, merged as it is or by a rebase merge
    internal: true
    requires:
      vars: [BRANCH]
    preconditions:
      - sh: git show-ref --verify --quiet refs/heads/{{.BRANCH}}
        msg: There's no local branch called {{.BRANCH}}.
    cmds:
      - git fetch --quiet origin
      # A branch merged as it is sits inside main's history. A rebase merge gives its commits new
      # hashes, so `git cherry` compares their changes instead, marking with + each commit whose
      # change isn't on main.
      - silent: true
        cmd: |
          if git merge-base --is-ancestor {{.BRANCH}} origin/main; then
            exit 0
          fi
          unmerged="$(git cherry origin/main {{.BRANCH}} | sed -n 's/^+ //p')"
          if [ -n "$unmerged" ]; then
            echo "{{.BRANCH}} has commits that aren't on main, so it's kept:" >&2
            git log --oneline --no-walk $unmerged >&2
            exit 1
          fi

  worktree:new:
    desc: Make a worktree called NAME beside the repo, on a new branch BRANCH from main or BASE, and set it up
    requires:
      vars: [NAME, BRANCH]
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
      FOLDER: '{{.WORKTREES_FOLDER}}/{{.NAME}}'
    preconditions:
      - sh: '[[ "{{.BRANCH}}" =~ {{.BRANCH_PATTERN}} ]]'
        msg: >-
          "{{.BRANCH}}" isn't a type and a short description, such as feat/run-history or
          fix/123-break-rounding. The types are those of Conventional Commits.
      - sh: '[ ! -e "{{.FOLDER}}" ]'
        msg: '{{.FOLDER}} already exists.'
    cmds:
      - git fetch origin
      # Always with -b, since without it git names the branch after the folder.
      - git worktree add --no-track -b {{.BRANCH}} "{{.FOLDER}}" {{.BASE}}
      - for: { var: LOCAL_SETTINGS }
        cmd: '[ ! -e "{{.MAIN_CHECKOUT}}/{{.ITEM}}" ] || cp -r "{{.MAIN_CHECKOUT}}/{{.ITEM}}" "{{.FOLDER}}/"'
      # The worktree's own Taskfile, which may differ from this one on another branch.
      - '{{.TASK_EXE}} --dir "{{.FOLDER}}" setup'
      - >-
        echo "Ready in {{.FOLDER}}. Give its dev server its own port, such as PORT=5174 npm run dev
        and PORT=5174 task check, and run end-to-end tests in one worktree at a time."

  worktree:done:
    desc: Remove the worktree called NAME and delete its branch, once its work is committed and on main
    requires:
      vars: [NAME]
    vars:
      FOLDER: '{{.WORKTREES_FOLDER}}/{{.NAME}}'
      BRANCH:
        sh: git -C "{{.FOLDER}}" branch --show-current 2>/dev/null || true
    preconditions:
      - sh: '[ -d "{{.FOLDER}}" ]'
        msg: There's no worktree at {{.FOLDER}}.
      - sh: '[ -z "$(git -C "{{.FOLDER}}" status --porcelain)" ]'
        msg: >-
          {{.FOLDER}} has uncommitted changes, so it's kept. Commit them, or decide what to do with
          them, first.
    cmds:
      # Checked before removing anything, so unmerged work is never left without its worktree.
      - task: branch:check-merged
        vars: { BRANCH: '{{.BRANCH}}' }
      - git worktree remove "{{.FOLDER}}"
      - git branch -D {{.BRANCH}}
      - git worktree prune --dry-run --verbose
      - git worktree prune
      - git worktree list -v

  ci:watch:
    desc: Watch the checks on this branch's pull request until they finish, failing if one fails
    vars:
      # How long to wait for GitHub to start the checks after a push.
      CHECKS_START_SECONDS: 60
    preconditions:
      - sh: gh pr view --json number > /dev/null 2>&1
        msg: This branch has no pull request yet. Push it and open one first.
    cmds:
      # Right after a push, GitHub takes a few seconds to start the checks, and until then
      # `--watch` stops at once with "no checks reported" rather than waiting.
      - silent: true
        cmd: |
          for second in $(seq {{.CHECKS_START_SECONDS}}); do
            if ! gh pr checks 2>&1 | grep -q "no checks reported"; then
              exit 0
            fi
            sleep 1
          done
          echo "GitHub didn't start the checks within {{.CHECKS_START_SECONDS}} seconds." >&2
          exit 1
      - gh pr checks --watch --fail-fast

  ci:logs:
    desc: Show the failed steps' log from this branch's latest CI run, or from RUN
    vars:
      LATEST_RUN:
        sh: '{{.LATEST_RUN_COMMAND}}'
      RUN: '{{.RUN | default .LATEST_RUN}}'
      CONCLUSION:
        sh: '[ -z "{{.RUN}}" ] || gh run view {{.RUN}} --json conclusion --jq .conclusion'
    preconditions:
      - sh: '[ -n "{{.RUN}}" ]'
        msg: This branch has no CI runs yet.
      # Without a failure, `--log-failed` prints nothing and still succeeds.
      - sh: '[ "{{.CONCLUSION}}" = failure ]'
        msg: >-
          CI run {{.RUN}} has nothing failed to show: its conclusion is
          "{{.CONCLUSION | default "not finished"}}".
    cmds:
      - gh run view {{.RUN}} --log-failed

  ci:report:
    desc: Download the Playwright report from this branch's latest CI run, or from RUN, and open it
    summary: |
      CI keeps the Playwright report, with the traces of failed tests, for 14 days, and only when
      a run fails. This downloads it into a temporary folder and serves it, as `task e2e:report`
      does for a local run.
    vars:
      LATEST_RUN:
        sh: '{{.LATEST_RUN_COMMAND}}'
      RUN: '{{.RUN | default .LATEST_RUN}}'
      ARTIFACTS:
        sh: >-
          [ -z "{{.RUN}}" ] || gh api "repos/{owner}/{repo}/actions/runs/{{.RUN}}/artifacts"
          --jq '[.artifacts[] | select(.expired | not) | .name] | join(" ")'
    preconditions:
      - sh: '[ -n "{{.RUN}}" ]'
        msg: This branch has no CI runs yet.
      - sh: '[[ " {{.ARTIFACTS}} " == *" playwright-report "* ]]'
        msg: >-
          CI run {{.RUN}} has no Playwright report. CI keeps one only when a run fails, and only
          for 14 days, and a run that failed before the Playwright tests has none.
    cmds:
      # The temporary folder is made here rather than as a variable, because variables are worked
      # out before the preconditions, and a refused call would leave an empty folder behind.
      - |
        folder="$(mktemp -d)"
        gh run download {{.RUN}} --name playwright-report --dir "$folder"
        npx playwright show-report "$folder/playwright-report"

  pr:merge:
    desc: Rebase-merge this branch's pull request once its checks pass, then update main and delete the branch
    summary: |
      Merging is the reviewer's sign-off, so this only runs when they've asked for the merge.
      The checks must already have passed: this doesn't wait for them, so run `task ci:watch`
      first. GitHub deletes the branch on GitHub itself once it merges.
    vars:
      BRANCH:
        sh: git branch --show-current
    preconditions:
      - sh: '[ "{{.BRANCH}}" != main ]'
        msg: You're on main. Switch to the pull request's branch first.
      - sh: '[ -z "$(git status --porcelain)" ]'
        msg: This branch has uncommitted changes. Commit or push them first.
      - sh: gh pr view --json number > /dev/null 2>&1
        msg: This branch has no pull request.
      # `gh pr checks` succeeds only when every check has passed.
      - sh: gh pr checks > /dev/null 2>&1
        msg: The pull request's checks haven't all passed. See them with `gh pr checks`.
    cmds:
      - gh pr merge --rebase
      - git switch main
      # Also forgets remote branches GitHub has deleted.
      - git pull --ff-only --prune
      - task: branch:delete
        vars: { BRANCH: '{{.BRANCH}}' }
