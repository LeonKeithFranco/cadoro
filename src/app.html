<!doctype html>
<!-- `data-theme` starts as dark, the spec's default, for a first visit or a browser that blocks
     localStorage. The script in the head replaces it before the page is first painted. -->
<html lang="en" data-theme="dark" class="scroll-pb-24 scheme-light md:scroll-pb-0 dark:scheme-dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Colours the browser's own bars to match the page, dark to start with, like the
		     manifest's `theme_color` does for the installed app. It comes before the script below,
		     which sets it to the saved theme's colour, and `ThemeSync` keeps it in step after. -->
		<meta name="theme-color" content="#09090b" />
		<!-- Shows the saved theme before the first paint, so a light or system theme doesn't flash
		     dark while IndexedDB is still being opened. It reads the mirror of the theme setting
		     that `DexieStorage` keeps in localStorage under `cadoro-theme`, and makes the same
		     choice as `resolveTheme` in `src/lib/theme.ts`, with the bars' colours from
		     `THEME_COLOURS` there. Once the app loads, `ThemeSync` takes over. -->
		<script>
			try {
				var savedTheme = localStorage.getItem('cadoro-theme');
				if (savedTheme === 'light' || savedTheme === 'dark' || savedTheme === 'system') {
					var isDark =
						savedTheme === 'system'
							? matchMedia('(prefers-color-scheme: dark)').matches
							: savedTheme === 'dark';
					document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
					document
						.querySelector('meta[name="theme-color"]')
						.setAttribute('content', isDark ? '#09090b' : '#ffffff');
				}
			} catch (error) {
				// localStorage is blocked: the page keeps the default theme.
			}
		</script>
		<!-- `%sveltekit.assets%` is the path to the files in `static/` and those the PWA plugin
		     writes beside them, such as the manifest. It follows the base path. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- The icons come from `npm run generate-icons`. Browsers that can't show the SVG use
		     the `.ico`, and iOS uses the touch icon on the home screen. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" sizes="any" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180x180.png" />
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
