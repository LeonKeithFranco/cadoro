<!doctype html>
<!-- The theme stays dark, the spec's default, until Settings can change it. -->
<html lang="en" data-theme="dark" class="scheme-light dark:scheme-dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- The PWA plugin writes the manifest beside the app's files. `%sveltekit.assets%` is the
		     path to them, which follows the base path. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
