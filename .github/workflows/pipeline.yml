name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Runs every check. The `Protect main` ruleset requires this job, by its
  # name, to pass before a pull request can merge.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Also runs the `prepare` script, which generates SvelteKit's types.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      # Only downloads the browser; the Playwright tests still run last. It
      # comes before the unit tests because component tests also run in this
      # Chromium, through Vitest's browser mode. `--with-deps` adds the system
      # libraries Chromium needs.
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Run unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
